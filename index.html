<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Empire Tycoon v0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17202a;color:#f5f5f5;font-family:Arial,sans-serif}
#app{max-width:900px;margin:auto;min-height:100vh;background:#263238}
header{padding:16px;background:#111a20;display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{font-size:22px;margin:0}.money{font-size:20px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.card{background:#37474f;padding:10px;border-radius:10px;text-align:center}.small{font-size:12px;opacity:.8}
main{padding:10px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plot{min-height:145px;background:#546e7a;border:2px solid #78909c;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.plot.empty{background:#455a64}.plot h3{margin:0;font-size:15px}
button{border:0;border-radius:8px;padding:10px;background:#90caf9;color:#102027;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.factory{background:#6d4c41;border-color:#a1887f}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.log{margin-top:12px;background:#111a20;border-radius:10px;padding:10px;height:120px;overflow:auto;font-size:13px}
@media(max-width:600px){.plot{min-height:125px}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:18px}.money{font-size:17px}}
</style>
</head>
<body>
<div id="app">
<header><h1>🏭 Empire Tycoon</h1><div class="money">₺<span id="money">100000</span></div></header>
<div class="stats">
 <div class="card">📦 Ürün<br><b id="products">0</b></div>
 <div class="card">🏭 Fabrika<br><b id="factories">0</b></div>
 <div class="card">📈 Gelir<br><b id="income">0</b>/10 sn</div>
</div>
<main>
 <div class="actions">
  <button id="sell">📦 Ürünleri Sat (+₺<span id="sellValue">0</span>)</button>
  <button id="upgrade">⬆️ Fabrikaları Geliştir</button>
 </div>
 <div class="map" id="map"></div>
 <div class="log" id="log"></div>
</main>
</div>
<script>
let money=100000, products=0, level=1, nextPlot=0;
const plots=Array.from({length:9},(_,i)=>({owned:i===0,factory:false}));
const costByLevel=()=>Math.floor(30000*Math.pow(1.7,level-1));
function log(t){const el=document.getElementById('log');el.innerHTML=`<div>• ${t}</div>`+el.innerHTML}
function factoryCount(){return plots.filter(p=>p.factory).length}
function production(){return factoryCount()*level}
function render(){
 document.getElementById('money').textContent=money.toLocaleString('tr-TR');
 document.getElementById('products').textContent=products;
 document.getElementById('factories').textContent=factoryCount();
 document.getElementById('income').textContent=production()*500;
 document.getElementById('sellValue').textContent=(products*500).toLocaleString('tr-TR');
 const map=document.getElementById('map'); map.innerHTML='';
 plots.forEach((p,i)=>{
  const d=document.createElement('div');d.className='plot '+(p.factory?'factory':'empty');
  if(p.factory)d.innerHTML=`<h3>🏭 Fabrika Lv.${level}</h3><div>Üretim: ${level}/10 sn</div><div>Arsa ${i+1}</div>`;
  else if(p.owned)d.innerHTML=`<h3>🏞️ Boş Arsa</h3><div>Fabrika kur</div><button>🏭 Kur (₺${costByLevel().toLocaleString('tr-TR')})</button>`;
  else {let c=50000*(i);d.innerHTML=`<h3>🔒 Kilitli Arsa</h3><div>Satın alma</div><button>₺${c.toLocaleString('tr-TR')}</button>`}
  const b=d.querySelector('button'); if(b)b.onclick=()=>clickPlot(i);
  map.appendChild(d);
 });
 document.getElementById('upgrade').textContent=`⬆️ Fabrikaları Geliştir (₺${(25000*level).toLocaleString('tr-TR')})`;
 document.getElementById('upgrade').disabled=factoryCount()===0||money<25000*level;
 document.getElementById('sell').disabled=products===0;
}
function clickPlot(i){
 const p=plots[i];
 if(p.owned&&!p.factory){
   const c=costByLevel(); if(money<c)return;
   money-=c;p.factory=true;log(`Yeni fabrika kuruldu! (-₺${c.toLocaleString('tr-TR')})`);
 } else if(!p.owned){
   const c=50000*i;if(money<c)return;
   money-=c;p.owned=true;log(`Yeni arsa satın alındı!`);
 }
 render();
}
document.getElementById('sell').onclick=()=>{if(!products)return;let v=products*500;money+=v;log(`${products} ürün satıldı: +₺${v.toLocaleString('tr-TR')}`);products=0;render()}
document.getElementById('upgrade').onclick=()=>{let c=25000*level;if(factoryCount()&&money>=c){money-=c;level++;log(`Fabrikalar seviye ${level} oldu.`);render()}}
setInterval(()=>{let n=production();if(n){products+=n;log(`${n} ürün üretildi.`);render()}},10000);
render();log('Şirketin kuruldu. İlk fabrikanı inşa et!');
</script>
</body>
</html>
